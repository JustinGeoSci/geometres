[package]
name = "geometres"
description = "Exact, non-constructive computational geometry: validation, DE-9IM predicates and certified measurement over f64 coordinates"
version = "0.1.0"
license = "MIT OR Apache-2.0"
authors = ["Justin Erlick"]
edition = "2024"
rust-version = "1.88"
readme = "README.md"
repository = "https://github.com/JustinGeoSci/geometres"
documentation = "https://docs.rs/geometres"
keywords = ["geometry", "computational-geometry", "de-9im", "exact", "gis"]
categories = ["science::geo", "mathematics"]

[dependencies]
arithmetica = "0.1.1"
situs = "0.1.0"

[features]
3d = []
unstable-counters = []

[dev-dependencies]
proptest = "=1.5.0"

[package.metadata.docs.rs]
features = ["3d"]
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
too_many_lines = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
wildcard_imports = "allow"
similar_names = "allow"
many_single_char_names = "allow"
redundant_closure_for_method_calls = "allow"
uninlined_format_args = "allow"
inline_always = "allow"
items_after_statements = "allow"
single_match_else = "allow"
